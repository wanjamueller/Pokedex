<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pokedex</title>

        <link rel="shortcut icon" href="./assets/icons/pokedex-mark.svg" type="image/x-icon" />

        <link rel="stylesheet" href="./styles/cards.css" />

        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/dialog.css" />
        <link rel="stylesheet" href="./styles/header.css" />
        <link rel="stylesheet" href="style.css" />

        <script defer src="./scripts/template.js"></script>
        <script defer src="script.js"></script>
    </head>
    <body onload="init()">
        <header class="site-header">
            <div class="header-content">
                <a href="#"
                    ><img src="./assets/icons/pokedex-mark.svg" alt="pokedex-logo" /><span class="pokedex"
                        >Pokédex</span
                    ></a
                >
                <section id="search" class="search">
                    <label for="search-input" class="field">
                        <span class="field-icon"></span>
                        <input data-id="search-input" id="search-input" type="text" placeholder="by name" />
                        <div id="search-button-container"></div>
                    </label>
                </section>
            </div>
        </header>
        <main data-id="content" id="content">
            <div class="search-message-wrapper">
                <p data-id="not-found" id="search-message"></p>
            </div>
            <section id="library-wrapper" class="library-wrapper"></section>
            <section id="card-loader" class="card-loader">
                <button data-id="load-more-button" id="load-more-button" class="" onclick="getMorePkm()">
                    Load further cards
                </button>
            </section>
        </main>
        <dialog data-id="dialog" id="dialog" class="dialog"></dialog>
        <footer></footer>
    </body>
</html>
