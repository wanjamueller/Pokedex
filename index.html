<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pokedex</title>

        <link rel="shortcut icon" href="./assets/icons/pokedex.png" type="image/x-icon" />

        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="style.css" />

        <script defer src="./scripts/template.js"></script>
        <script defer src="script.js"></script>
    </head>
    <body onload="init()">
        <header>
            <section id="search" class="search">
                <input data-id="search-input" id="search-input" type="text" />
                <div id="search-button-container"></div>
                <p data-id="not-found" id="search-message"></p>
            </section>
        </header>
        <main data-id="content">
            <section id="library-wrapper" class="library-wrapper"></section>
            <section id="card-loader" class="card-loader"></section>
        </main>
        <dialog data-id="dialog" id="dialog"></dialog>
        <footer></footer>
    </body>
</html>
